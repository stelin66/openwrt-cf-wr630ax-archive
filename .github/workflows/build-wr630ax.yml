name: Build COMFAST CF-WR630AX OpenWrt

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-wr630ax.yml"
      - "archive/openwrt-pr-20654.patch"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout archive repository
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget

      - name: Fetch exact OpenWrt base
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout 7670addb077d7556a5603f0b26e2bad1b052ae84
          git status --short
          git rev-parse HEAD

      - name: Apply archived WR630AX port
        run: |
          cd openwrt
          git apply --check ../archive/openwrt-pr-20654.patch
          git apply ../archive/openwrt-pr-20654.patch
          git diff --check

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure only COMFAST CF-WR630AX
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_comfast_cf-wr630ax=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_mediatek|cf-wr630ax' .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j8

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Verify and checksum WR630AX images
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*cf-wr630ax*' -print
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*cf-wr630ax*' -exec cp {} firmware/ \;
          test -n "$(find firmware -maxdepth 1 -type f -name '*factory.bin' -print -quit)"
          test -n "$(find firmware -maxdepth 1 -type f -name '*sysupgrade.bin' -print -quit)"
          cd firmware
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: comfast-cf-wr630ax-openwrt
          path: firmware/
          retention-days: 90

      - name: Upload build config on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wr630ax-build-debug
          path: |
            openwrt/.config
            openwrt/tmp/.config-package.in
          if-no-files-found: ignore
          retention-days: 30
