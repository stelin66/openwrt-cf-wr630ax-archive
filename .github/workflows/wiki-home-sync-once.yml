name: Sync wiki Home once

on:
  push:
    branches:
      - wiki-home-sync-helper

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Publish Home.md to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp wiki-source/Home.md wiki/Home.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Home.md; then
            echo "Wiki Home.md already matches source"
            exit 0
          fi
          git add Home.md
          git commit -m "docs: sync Home from repository source"
          git push origin HEAD
