name: Build WR630AX current-main initramfs

on:
  workflow_dispatch:
  push:
    branches:
      - current-main-port
    paths:
      - 'current-main/**'
      - '.github/workflows/build-cf-wr630ax-current-main-initramfs.yml'

permissions:
  contents: read

concurrency:
  group: cf-wr630ax-current-main-initramfs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_BASE: c759267c92b0697a6fd6f369164a5ed4c1a6a03c
      DEVICE_CONFIG: CONFIG_TARGET_mediatek_filogic_DEVICE_comfast_cf-wr630ax=y

    steps:
      - name: Checkout WR630AX archive branch
        uses: actions/checkout@v4
        with:
          path: archive-repo

      - name: Checkout pinned current OpenWrt main
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_BASE }}
          fetch-depth: 0
          path: openwrt

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools libelf-dev rsync swig unzip zlib1g-dev zstd \
            file wget ca-certificates u-boot-tools

      - name: Apply current-main WR630AX draft port
        run: |
          set -euxo pipefail
          cd openwrt
          test "$(git rev-parse HEAD)" = "$OPENWRT_BASE"
          test ! -e target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          cp "$GITHUB_WORKSPACE/archive-repo/current-main/mt7981b-comfast-cf-wr630ax.dts" \
             target/linux/mediatek/dts/
          python3 "$GITHUB_WORKSPACE/archive-repo/current-main/apply-port.py"

          grep -Fq 'model = "COMFAST CF-WR630AX";' target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          grep -Fq 'linux,code = <KEY_WPS_BUTTON>;' target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          grep -Fq 'macaddr_factory_4: macaddr@4 {' target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          grep -Fq 'macaddr_factory_8000: macaddr@8000 {' target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          grep -Fq 'nvmem-cells = <&macaddr_factory_4 0>;' target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          grep -Fq 'nvmem-cells = <&macaddr_factory_8000 0>;' target/linux/mediatek/dts/mt7981b-comfast-cf-wr630ax.dts
          grep -Fq 'define Device/comfast_cf-wr630ax' target/linux/mediatek/image/filogic.mk
          grep -Fq 'comfast,cf-wr630ax' target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          grep -Fq 'ucidef_set_led_netdev "wan" "WAN" "blue:wan" "eth1" "link tx rx"' \
            target/linux/mediatek/filogic/base-files/etc/board.d/01_leds
          ! grep -Fq 'comfast,cf-wr630ax)' \
            target/linux/mediatek/filogic/base-files/etc/hotplug.d/ieee80211/11_fix_wifi_mac

          git diff --check
          git diff --stat
          git diff > "$GITHUB_WORKSPACE/current-main-port.diff"

      - name: Update and install current feeds
        run: |
          set -euxo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          {
            echo "Resolved feed commits for this experimental build:"
            for feed in packages luci routing telephony video; do
              if [ -d "feeds/$feed/.git" ]; then
                echo "$feed=$(git -C "feeds/$feed" rev-parse HEAD)"
              fi
            done
          } | tee "$GITHUB_WORKSPACE/current-main-feed-commits.txt"

      - name: Configure WR630AX current-main initramfs
        run: |
          set -euxo pipefail
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_comfast_cf-wr630ax=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          EOF
          make defconfig
          grep -Fxq 'CONFIG_TARGET_mediatek=y' .config
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -Fxq "$DEVICE_CONFIG" .config
          grep -Fxq 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config
          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/diffconfig-current-main-initramfs.txt"

      - name: Download sources
        run: |
          set -euxo pipefail
          cd openwrt
          make -j"$(nproc)" download

      - name: Build current-main initramfs
        run: |
          set -euo pipefail
          cd openwrt
          if ! make -j"$(nproc)"; then
            echo "::warning::Parallel build failed; rerunning serially with V=s"
            make -j1 V=s
          fi

      - name: Verify and stage initramfs
        run: |
          set -euo pipefail
          cd openwrt
          out="bin/targets/mediatek/filogic"
          stage="$GITHUB_WORKSPACE/wr630ax-current-main-initramfs-artifacts"
          test -d "$out"
          mkdir -p "$stage"

          shopt -s nullglob
          images=( "$out"/*cf-wr630ax*initramfs* )
          if (( ${#images[@]} != 1 )); then
            echo "::error::Expected exactly one WR630AX initramfs image, found ${#images[@]}"
            find "$out" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          image="${images[0]}"
          cp "$image" "$stage/"
          cp .config "$stage/openwrt-current-main-initramfs.config"
          cp "$GITHUB_WORKSPACE/diffconfig-current-main-initramfs.txt" "$stage/"
          cp "$GITHUB_WORKSPACE/current-main-port.diff" "$stage/"
          cp "$GITHUB_WORKSPACE/current-main-feed-commits.txt" "$stage/"

          dumpimage -l "$image" | tee "$stage/FIT-INFO.txt"

          (
            cd "$stage"
            sha256sum "$(basename "$image")" | tee SHA256SUMS
          )

          {
            echo "OpenWrt current-main base: $OPENWRT_BASE"
            echo "Archive branch commit: ${GITHUB_SHA}"
            echo "Device config: $DEVICE_CONFIG"
            echo "Initramfs: CONFIG_TARGET_ROOTFS_INITRAMFS=y"
            echo "Kernel load address: 0x44000000"
            echo "DT load address: 0x43f00000"
            echo
            cat "$GITHUB_WORKSPACE/current-main-feed-commits.txt"
            echo
            stat -c '%n %s bytes' "$stage"/*initramfs*
          } | tee "$stage/BUILD-METADATA.txt"

      - name: Upload current-main initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-wr630ax-current-main-initramfs-${{ github.run_number }}
          path: wr630ax-current-main-initramfs-artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
